version: '3.8'

services:
  # PostgreSQL Database for Catalog Service
  catalog-db:
    image: postgres:15-alpine
    container_name: catalog-db
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_pass
    volumes:
      - catalog-data:/var/lib/postgresql/data
    networks:
      - library-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Catalog Service (Python/Flask)
  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    environment:
      DB_HOST: catalog-db
      DB_NAME: catalog_db
      DB_USER: catalog_user
      DB_PASS: catalog_pass
    ports:
      - "5000:5000"
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - library-net
    restart: unless-stopped

  # MySQL Database for User Service
  user-db:
    image: mysql:8.0
    container_name: user-db
    environment:
      MYSQL_DATABASE: user_db
      MYSQL_USER: user_user
      MYSQL_PASSWORD: user_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - user-data:/var/lib/mysql
    networks:
      - library-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user_user", "-puser_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Service (Python/Flask)
  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      DB_HOST: user-db
      DB_NAME: user_db
      DB_USER: user_user
      DB_PASS: user_pass
    ports:
      - "5001:5001"
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - library-net
    restart: unless-stopped

  # MySQL Database for Order Service
  order-db:
    image: mysql:8.0
    container_name: order-db
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - order-data:/var/lib/mysql
    networks:
      - library-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "order_user", "-porder_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Order Service (PHP)
  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      DB_HOST: order-db
      DB_NAME: order_db
      DB_USER: order_user
      DB_PASS: order_pass
    ports:
      - "8080:80"
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - library-net
    restart: unless-stopped

networks:
  library-net:
    driver: bridge

volumes:
  catalog-data:
  user-data:
  order-data:
